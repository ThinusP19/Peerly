# Security headers for Peerly's web pages. Included inside the nginx site's
# "location /" block, which serves the web app. The API sets its own headers
# (helmet), so "location /api/" does not include this file - nginx would send
# every header twice.
#
# Install on the server:
#   cp /var/www/peerly/deploy/nginx-peerly-headers.conf /etc/nginx/snippets/peerly-headers.conf
# then add "include snippets/peerly-headers.conf;" inside "location / { ... }" in
# /etc/nginx/sites-available/peerly, and run: nginx -t && systemctl reload nginx

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Content-Security-Policy "frame-ancestors 'self'" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Hide the nginx version from every response of this site.
server_tokens off;
