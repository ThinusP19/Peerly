<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Peerly">
  <!-- Three peers, linked into a tick: peer assessment in one shape. The
       middle node carries the lavender accent so the tick still reads as
       people at large sizes. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5A3A8A"/>
      <stop offset="1" stop-color="#3A2160"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <path d="M16 33 L27.5 44.5 L48 21" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="16" cy="33" r="6.5" fill="#FFFFFF"/>
  <circle cx="27.5" cy="44.5" r="6.5" fill="#D9C8F5"/>
  <circle cx="48" cy="21" r="6.5" fill="#FFFFFF"/>
</svg>
