<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Social share card. Mirrors the sign-in panel: plum ground, the mark,
       the same eyebrow, headline and supporting line. -->
  <rect width="1200" height="630" fill="#462A69"/>

  <!-- The mark again, oversized and faint, bleeding off the right edge. -->
  <g transform="translate(700, 90) scale(11)" opacity="0.07">
    <path d="M16 33 L27.5 44.5 L48 21" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="33" r="6.5" fill="#FFFFFF"/>
    <circle cx="27.5" cy="44.5" r="6.5" fill="#FFFFFF"/>
    <circle cx="48" cy="21" r="6.5" fill="#FFFFFF"/>
  </g>

  <!-- Transparent mark, no tile, matching the sign-in panel. -->
  <g transform="translate(88, 76) scale(1.5)">
    <path d="M16 33 L27.5 44.5 L48 21" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="16" cy="33" r="6.5" fill="#FFFFFF"/>
    <circle cx="27.5" cy="44.5" r="6.5" fill="#D9C8F5"/>
    <circle cx="48" cy="21" r="6.5" fill="#FFFFFF"/>
  </g>
  <text x="210" y="145"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="54" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">Peerly</text>

  <text x="96" y="330"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="22" font-weight="600" fill="#B9A8CC" letter-spacing="5">NORTH-WEST UNIVERSITY</text>
  <text font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="74" font-weight="700" fill="#FFFFFF" letter-spacing="-2">
    <tspan x="92" y="412">Peer assessment</tspan>
    <tspan x="92" y="494">made transparent.</tspan>
  </text>
  <text x="96" y="560"
        font-family="Inter, 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="28" font-weight="400" fill="#D5C7E3">Fair, transparent peer assessment for university group projects.</text>
</svg>
