<svg xmlns="http://www.w3.org/2000/svg" viewBox="5.5 6.25 53 53" width="64" height="64" role="img" aria-label="Peerly">
  <!-- Transparent bitmap favicons (16/32/48 PNG and the .ico). A bitmap can't
       follow the OS theme like favicon.svg does, so this uses a mid purple
       that holds up on both light and dark browser chrome. -->
  <path d="M15 33 L27 45 L49 20.5" fill="none" stroke="#6B389B" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#6B389B">
    <circle cx="15" cy="33" r="7.5"/>
    <circle cx="27" cy="45" r="7.5"/>
    <circle cx="49" cy="20.5" r="7.5"/>
  </g>
</svg>
