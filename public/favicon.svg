    <path d="M32 22 L18 44"/>
    <path d="M32 22 L46 44"/>
    <path d="M18 44 L46 44"/>
  </g>
  <g fill="#FFFFFF">
    <circle cx="32" cy="21" r="7.5"/>
    <circle cx="18" cy="44" r="7.5"/>
    <circle cx="46" cy="44" r="7.5"/>
  </g>
</svg>
