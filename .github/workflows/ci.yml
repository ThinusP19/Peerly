# CI gate (SI-08, OR-24).
#
# Four jobs, each its own status check so branch protection on main can require
# them one by one (see docs/handover/ci.md):
#
#   calculation - the Felder mark calculation tests and their coverage, alone,
#                 so "a failing calculation test blocks the merge" is one check
#   server      - API typecheck and the full API test suite against PostgreSQL
#   frontend    - lint, typecheck, unit tests and a production build
#   e2e         - Playwright browser tests against both servers and a seeded DB
#
# Every credential here is a throwaway for a database that lives only as long
# as the job. No repository secrets are used.

name: CI

on:
  push:
    branches: [main, backend]
  pull_request:
    branches: [main, backend]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Same major as local development ($HOME/.local/node/bin/node is v24).
  NODE_VERSION: "24"

jobs:
  calculation:
    name: calculation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The API's vitest config migrates a test database before any test file
    # runs, including this pure one, so it needs a Postgres too.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peerly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/peerly_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Felder calculation tests
        run: npx vitest run src/lib/felder.test.ts
      - name: Felder calculation coverage
        run: npm run coverage

  server:
    name: server
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peerly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/peerly_test
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: peerly_dev
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Read by the API (server/src/config/env.ts), by the migrate and seed
      # scripts, and by e2e/global-setup.ts, which reseeds before the suite.
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/peerly_dev
      CORS_ORIGINS: http://127.0.0.1:7331,http://localhost:7331
      APP_URL: http://127.0.0.1:7331
      MAIL_TRANSPORT: log
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - name: Install web app
        run: npm ci
      - name: Install API
        working-directory: server
        run: npm ci
      - name: Migrate and seed
        working-directory: server
        run: |
          npm run migrate
          npm run seed
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # playwright.config.ts starts both servers itself when CI is set
      # (GitHub sets CI=true on every runner).
      - name: Browser tests
        run: npx playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
